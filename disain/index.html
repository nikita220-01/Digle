<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digle Message</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            background: #0a0a0a;
            color: white;
            overflow: hidden;
        }

        /* === АВТОРИЗАЦИЯ === */
        .auth-wrapper {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0a 100%);
        }
        .auth-box {
            background: #111;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        .auth-box h2 { text-align: center; margin-bottom: 25px; font-size: 22px; color: #e0e0e0; }
        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 6px; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .field input {
            width: 100%; padding: 11px 14px; background: #1a1a1a;
            border: 1px solid #333; border-radius: 8px; color: white;
            font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        .field input:focus { border-color: #5865F2; }
        .btn-primary {
            width: 100%; padding: 12px; background: #5865F2; color: white;
            border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; margin-top: 8px; transition: background 0.2s;
        }
        .btn-primary:hover { background: #4752C4; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .auth-switch { text-align: center; margin-top: 16px; font-size: 13px; color: #888; }
        .auth-switch a { color: #5865F2; cursor: pointer; }

        /* === ОСНОВНОЙ ИНТЕРФЕЙС === */
        .app { display: none; height: 100vh; flex-direction: column; }

        /* Шапка */
        .header {
            height: 52px; background: #0f0f0f; border-bottom: 1px solid #1f1f1f;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; position: relative; z-index: 10;
        }
        .header-left { display: flex; align-items: center; width: 70px; }
        .burger-btn {
            background: none; border: none; color: #aaa; font-size: 22px;
            cursor: pointer; padding: 8px; border-radius: 8px;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .burger-btn:hover { background: #1a1a1a; color: white; }
        .header-center { position: absolute; left: 50%; transform: translateX(-50%); }
        .logo {
            font-size: 18px; font-weight: 700; letter-spacing: 3px;
            background: linear-gradient(135deg, #5865F2, #A855F7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; width: 70px; justify-content: flex-end; }
        .user-icon-btn {
            width: 36px; height: 36px; border-radius: 50%; background: #5865F2;
            border: none; cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 16px; font-weight: 700; color: white;
            overflow: hidden; transition: transform 0.2s;
        }
        .user-icon-btn:hover { transform: scale(1.1); }
        .user-icon-btn img { width: 100%; height: 100%; object-fit: cover; }

        /* Основная область */
        .main { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* Узкая левая панель */
        .users-bar {
            width: 70px; background: #080808; border-right: 1px solid #1f1f1f;
            display: flex; flex-direction: column; align-items: center;
            padding: 12px 0; gap: 10px; overflow-y: auto; z-index: 5;
        }
        .user-avatar-small {
            width: 46px; height: 46px; border-radius: 50%; background: #252525;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .user-avatar-small:hover, .user-avatar-small.active {
            border-radius: 14px; background: #5865F2;
        }
        .user-avatar-small img { width: 100%; height: 100%; object-fit: cover; }

        /* Центр — чаты */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0d0d0d; }
        .chat-header {
            height: 48px; border-bottom: 1px solid #1f1f1f;
            display: flex; align-items: center; padding: 0 20px;
            font-size: 15px; font-weight: 600; color: #ddd;
        }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .empty-chat {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 15px;
        }

        /* Сообщения */
        .message {
            max-width: 70%; padding: 10px 14px; border-radius: 14px;
            font-size: 14px; line-height: 1.4; word-wrap: break-word;
            animation: msgIn 0.2s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.own {
            align-self: flex-end; background: #5865F2; color: white;
            border-bottom-right-radius: 4px;
        }
        .message.other {
            align-self: flex-start; background: #1f1f1f; color: #eee;
            border-bottom-left-radius: 4px;
        }
        .message-meta {
            font-size: 10px; opacity: 0.7; margin-top: 4px;
        }
        .message-image {
            max-width: 240px; border-radius: 8px; margin-top: 6px; cursor: pointer;
        }

        /* Поле ввода */
        .input-area {
            padding: 14px 20px; border-top: 1px solid #1f1f1f;
            display: flex; gap: 10px; align-items: center;
        }
        .input-area input[type="text"] {
            flex: 1; padding: 11px 16px; background: #1a1a1a;
            border: 1px solid #333; border-radius: 22px; color: white;
            font-size: 14px; outline: none;
        }
        .input-area input[type="text"]:focus { border-color: #5865F2; }
        .btn-attach {
            background: none; border: none; color: #888; font-size: 20px;
            cursor: pointer; padding: 8px; border-radius: 50%;
            transition: all 0.2s;
        }
        .btn-attach:hover { background: #1a1a1a; color: white; }
        .btn-send {
            padding: 10px 20px; background: #5865F2; color: white;
            border: none; border-radius: 22px; cursor: pointer;
            font-size: 14px; font-weight: 600; transition: background 0.2s;
        }
        .btn-send:hover { background: #4752C4; }
        .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

        /* === BACKDROP (затемнение + blur) === */
        .backdrop {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .backdrop.show { opacity: 1; pointer-events: auto; }

        /* === БОКОВЫЕ ПАНЕЛИ === */
        .side-panel {
            position: fixed; top: 52px; height: calc(100vh - 52px);
            background: #111; border: 1px solid #1f1f1f;
            z-index: 60; overflow-y: auto;
            transition: transform 0.3s ease;
        }
        .left-panel { left: 70px; width: 280px; transform: translateX(-120%); }
        .right-panel { right: 0; width: 300px; transform: translateX(120%); border-left: 1px solid #1f1f1f; }
        .left-panel.open { transform: translateX(0); }
        .right-panel.open { transform: translateX(0); }

        .panel-header {
            padding: 16px; font-size: 12px; color: #888;
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid #1f1f1f;
        }
        .menu-list { padding: 8px; }
        .menu-item {
            padding: 12px 14px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; gap: 12px;
            font-size: 14px; color: #ccc; transition: background 0.2s; margin-bottom: 4px;
        }
        .menu-item:hover { background: #1a1a1a; }
        .menu-item.active { background: #252525; color: white; }
        .menu-item-icon { font-size: 18px; }

        .search-section { padding: 12px; border-bottom: 1px solid #1f1f1f; }
        .search-input {
            width: 100%; padding: 10px 12px; background: #1a1a1a;
            border: 1px solid #333; border-radius: 8px; color: white;
            font-size: 13px; outline: none;
        }
        .search-input:focus { border-color: #5865F2; }
        .search-results { padding: 8px; max-height: 300px; overflow-y: auto; }
        .search-result-item {
            padding: 10px 12px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; gap: 10px; transition: background 0.2s;
        }
        .search-result-item:hover { background: #1a1a1a; }
        .search-result-avatar {
            width: 36px; height: 36px; border-radius: 50%; background: #333;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; overflow: hidden;
        }
        .search-result-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .search-result-info { flex: 1; }
        .search-result-name { font-size: 13px; color: #eee; }
        .search-result-id { font-size: 11px; color: #666; }

        /* Профиль в кабинете */
        .profile-card { padding: 24px; text-align: center; border-bottom: 1px solid #1f1f1f; }
        .profile-avatar-large {
            width: 90px; height: 90px; border-radius: 50%; background: #5865F2;
            margin: 0 auto 14px; display: flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 700; cursor: pointer; position: relative;
            overflow: hidden; transition: transform 0.2s;
        }
        .profile-avatar-large:hover { transform: scale(1.05); }
        .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }
        .profile-avatar-large::after {
            content: "📷"; position: absolute; bottom: 0; right: 0;
            background: #5865F2; width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; border: 2px solid #111;
        }
        .profile-display-name { font-size: 18px; font-weight: 600; color: #eee; margin-bottom: 6px; }
        .profile-display-id {
            font-size: 12px; color: #888; background: #1a1a1a;
            padding: 4px 10px; border-radius: 4px; display: inline-block;
            font-family: monospace; cursor: pointer;
        }
        .profile-display-id:hover { background: #252525; }

        .edit-card { padding: 20px; }
        .edit-card h3 { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .edit-field { margin-bottom: 14px; }
        .edit-field label { display: block; font-size: 11px; color: #888; margin-bottom: 6px; }
        .edit-field input {
            width: 100%; padding: 9px 12px; background: #1a1a1a;
            border: 1px solid #333; border-radius: 6px; color: white;
            font-size: 13px; outline: none;
        }
        .edit-field input:focus { border-color: #5865F2; }
        .btn-save {
            padding: 8px 14px; background: #5865F2; color: white;
            border: none; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 6px;
        }
        .btn-save:hover { background: #4752C4; }
        .btn-save:disabled { opacity: 0.5; }
        .btn-logout {
            width: 100%; padding: 10px; background: transparent; color: #ef4444;
            border: 1px solid #ef4444; border-radius: 6px; font-size: 13px;
            cursor: pointer; margin-top: 16px;
        }
        .btn-logout:hover { background: #ef4444; color: white; }

        /* Уведомления */
        .toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #5865F2; color: white; padding: 10px 20px;
            border-radius: 8px; font-size: 13px; opacity: 0;
            transition: all 0.3s; z-index: 1000;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- АВТОРИЗАЦИЯ -->
    <div class="auth-wrapper" id="authScreen">
        <div class="auth-box">
            <h2 id="authTitle">Вход в Digle</h2>
            <form id="authForm">
                <div class="field" id="nameField" style="display:none;">
                    <label>Имя пользователя</label>
                    <input type="text" id="regUsername" placeholder="Никита">
                </div>
                <div class="field">
                    <label>Почта</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="field">
                    <label>Пароль</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="authBtn">Войти</button>
            </form>
            <div class="auth-switch">
                <span id="switchText">Нет аккаунта?</span>
                <a id="switchLink">Зарегистрироваться</a>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div class="app" id="app">
        <div class="header">
            <div class="header-left">
                <button class="burger-btn" id="burgerBtn">☰</button>
            </div>
            <div class="header-center">
                <div class="logo">DIGLE</div>
            </div>
            <div class="header-right">
                <button class="user-icon-btn" id="userIconBtn">?</button>
            </div>
        </div>

        <div class="main">
            <div class="users-bar" id="usersBar"></div>

            <div class="chat-area">
                <div class="chat-header" id="chatHeader">Выберите пользователя</div>
                <div class="chat-messages" id="chatMessages">
                    <div class="empty-chat">Выберите пользователя слева, чтобы начать общение</div>
                </div>
                <div class="input-area" id="inputArea" style="display:none;">
                    <button class="btn-attach" id="attachBtn" title="Прикрепить файл">📎</button>
                    <input type="file" id="fileInput" style="display:none;">
                    <input type="text" id="messageInput" placeholder="Написать сообщение...">
                    <button class="btn-send" id="sendBtn">Отправить</button>
                </div>
            </div>
        </div>

        <!-- Backdrop -->
        <div class="backdrop" id="backdrop"></div>

        <!-- Левая панель (бургер) -->
        <div class="side-panel left-panel" id="leftPanel">
            <div class="panel-header">Меню</div>
            <div class="menu-list">
                <div class="menu-item active" data-section="search">
                    <span class="menu-item-icon">🔍</span><span>Поиск друзей</span>
                </div>
                <div class="menu-item" data-section="chats">
                    <span class="menu-item-icon">💬</span><span>Мои чаты</span>
                </div>
                <div class="menu-item" data-section="settings">
                    <span class="menu-item-icon">⚙️</span><span>Настройки</span>
                </div>
            </div>
            <div class="search-section">
                <input type="text" class="search-input" id="searchInput" placeholder="ID (#1) или ник...">
            </div>
            <div class="search-results" id="searchResults">
                <div style="padding: 16px; color: #666; text-align: center; font-size: 12px;">Начните вводить</div>
            </div>
        </div>

        <!-- Правая панель (кабинет) -->
        <div class="side-panel right-panel" id="rightPanel">
            <div class="panel-header">Кабинет</div>
            <div class="profile-card">
                <div class="profile-avatar-large" id="profileAvatar">
                    <span id="avatarLetter">?</span>
                </div>
                <input type="file" id="avatarInput" accept="image/*" style="display:none;">
                <div class="profile-display-name" id="profileName">Загрузка...</div>
                <div class="profile-display-id" id="profileId" title="Нажмите, чтобы скопировать">#0</div>
            </div>
            <div class="edit-card">
                <h3>Редактировать</h3>
                <div class="edit-field">
                    <label>Юзернейм</label>
                    <input type="text" id="editUsername" placeholder="Новый ник">
                    <button class="btn-save" id="saveUsernameBtn">Сохранить</button>
                </div>
                <button class="btn-logout" id="logoutBtn">Выйти из аккаунта</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
